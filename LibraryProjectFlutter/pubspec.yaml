name: shelfswap
description: "A Flutter project."
publish_to: 'none'
# If you want to update the app's version semantically, you will have to do it manually here since I didn't
# make it possible to update the app's visible version in fastlane (you could do it there, I just didn't do it).
# For every appbundle that you build this + number is the version code, it gets incremented automatically each
# time through fastlane. Note that users will never see the version code, and you really don't have to touch it
version: 0.1.0+14

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  camera: ^0.11.0+2
  crypto: ^3.0.6
  dio: ^5.8.0+1
  flutter:
    sdk: flutter
  firebase_auth: ^5.3.1
  firebase_core : ^3.6.0
  firebase_database: ^11.1.4
  firebase_storage: ^12.3.4
  google_mlkit_barcode_scanning: ^0.13.0
  google_sign_in: ^6.2.1
  http: any
  image_picker: ^1.1.2
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.2.1
  iconsax_plus: ^1.0.0
  connectivity_plus: ^6.1.2
  file_picker: ^8.3.5
  csv: ^6.0.0 # used for parsing goodreads csv imports
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4
  pointycastle: ^3.9.1
  flutter_native_splash: 2.4.4
  firebase_app_check: ^0.3.2+4
  url_launcher: ^6.3.1
  firebase_messaging: ^15.2.1
  flutter_local_notifications: ^17.0.1 # if you update this you will have to fix the code which doesnt work on v18
  aws_common: 0.7.5 # updating this requires you to update flutter
  aws_signature_v4: 0.6.3 # updating this requires you to update flutter

dependency_overrides:
  camera_android_camerax: 0.6.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/logo/
    - .env

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
